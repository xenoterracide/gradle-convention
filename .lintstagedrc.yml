# common
"Makefile":
  - &mit "uv run reuse annotate --license 'MIT' --copyright 'Caleb Cushing' --copyright-prefix spdx-string-symbol --merge-copyrights --fallback-dot-license"
"{.config/git/hooks/*,*.sh}":
  - "uv run reuse annotate --license 'MIT' --copyright 'Caleb Cushing' --copyright-prefix spdx-string-symbol --merge-copyrights --style python"
  - &prettier "prettier --cache --ignore-unknown --write"
"!(SKILL).{md,adoc}":
  - "uv run reuse annotate --license 'CC-BY-NC-4.0' --copyright 'Caleb Cushing' --copyright-prefix spdx-string-symbol --merge-copyrights"
  - *prettier
"SKILL.md":
  - *prettier
"*.{xml,yml,yaml,properties,toml,json5,js}":
  - &cc0 "uv run reuse annotate --license 'CC0-1.0' --copyright 'Caleb Cushing' --copyright-prefix spdx-string-symbol --merge-copyrights --fallback-dot-license"
  - *prettier
".{editorconfig,gitattributes,mailmap}":
  - *cc0
  - *prettier
".*ignore":
  - *cc0
  - *prettier
"!(package).json":
  - *cc0
  - *prettier
"package.json":
  - *mit
  - *prettier
"*.gradle.kts":
  - *mit
  - ktlint --format
# unique
"*.java":
  - "uv run reuse annotate --license 'GPL-3.0-or-later WITH Classpath-exception-2.0' --copyright 'Caleb Cushing' --copyright-prefix spdx-string-symbol --merge-copyrights"
  - *prettier
"*.ts":
  - "uv run reuse annotate --license 'GPL-3.0-or-later' --copyright 'Caleb Cushing' --copyright-prefix spdx-string-symbol --merge-copyrights"
  - *prettier
