# Support all platforms for esbuild and other platform-specific packages
# This ensures the lockfile remains consistent across different environments
supportedArchitectures:
  os:
    - darwin
    - linux
    - win32
  cpu:
    - x64
    - arm64
    - arm
    - ia32
